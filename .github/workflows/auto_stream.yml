name: Otomatik Mono M3U8 Tarayıcı

on:
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir çalışır
  workflow_dispatch: # Manuel tetiklenebilir

jobs:
  scrape-streams:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Tarayıcı Scriptini Çalıştır
        run: python stream_scraper.py

      - name: Değişiklikleri GitHub'a Kaydet (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add active_streams.json
          git commit -m "Otomatik m3u8 yayınları güncellendi [Bot]" || exit 0
          git push
